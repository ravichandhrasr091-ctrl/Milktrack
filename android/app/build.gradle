apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def cognitoDomain = providers.gradleProperty("milktrackCognitoDomain")
    .orElse(providers.environmentVariable("MILKTRACK_COGNITO_DOMAIN"))
    .getOrElse("https://ap-southeast-2voy11gkkz.auth.ap-southeast-2.amazoncognito.com")
def cognitoClientId = providers.gradleProperty("milktrackCognitoClientId")
    .orElse(providers.environmentVariable("MILKTRACK_COGNITO_CLIENT_ID"))
    .getOrElse("5lbntfih0ad9srq14ke0uc15mq")
def quoteBuildConfigValue = { value ->
    "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

android {
    namespace = "com.milktrack.app"
    compileSdk = 36
    buildFeatures {
        compose true
        buildConfig true
    }
    defaultConfig {
        applicationId "com.milktrack.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "2")
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "0.2.0"
        buildConfigField "String", "COGNITO_DOMAIN", quoteBuildConfigValue(cognitoDomain)
        buildConfigField "String", "COGNITO_CLIENT_ID", quoteBuildConfigValue(cognitoClientId)
        manifestPlaceholders = [appAuthRedirectScheme: "com.milktrack.app"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'net.openid:appauth:0.11.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
